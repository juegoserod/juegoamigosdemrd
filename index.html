<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Anónimo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        
        <!-- PANTALLA 1: Ingreso -->
        <div id="screen-login" class="screen">
            <h1>Amigo de Mierda</h1>
            <p>Ingresa tu Nickname</p>
            <input type="text" id="nickname-input" placeholder="Ej: ElMati" maxlength="15">
            <button id="btn-join">Entrar a la sala</button>
        </div>

        <!-- PANTALLA 2: Sala de espera -->
        <div id="screen-lobby" class="screen hidden">
            <h2>Sala de Espera</h2>
            <p>Jugadores conectados: <span id="player-count">0</span>/7</p>
            <ul id="player-list"></ul>
            <div class="admin-controls">
                <p>Alguien lea la carta física y luego presionen:</p>
                <button id="btn-start-round">Iniciar Votación</button>
            </div>
        </div>

        <!-- PANTALLA 3: Votación -->
        <div id="screen-voting" class="screen hidden">
            <h2>¡Vota en secreto!</h2>
            <p>¿Quién es el más propenso a lo que dice la carta?</p>
            <div id="voting-options"></div>
            <p id="vote-status" class="hidden">¡Voto enviado! Esperando a los demás...</p>
        </div>

        <!-- PANTALLA 4: Resultados -->
        <div id="screen-results" class="screen hidden">
            <h2>Resultados de la ronda</h2>
            <div id="results-list"></div>
            <button id="btn-next-round">Siguiente Ronda</button>
        </div>

    </div>

    <!-- SDKs de Firebase (Versión 10 Modular) -->
    <script type="module" src="app.js"></script>
</body>
</html>
